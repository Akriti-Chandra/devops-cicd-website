name: Deploy Website

on:
  push:
    branches:
      - master
      
permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Build
        run: |
          mkdir build
          cp index.html style.css script.js build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://akriti-devops-cicd-website-2026 
